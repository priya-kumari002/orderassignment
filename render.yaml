services:
  - type: web
    name: order-management-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: order-management-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: order-management-db
    plan: free
    databaseName: order_mgmt
    user: orderdesk
